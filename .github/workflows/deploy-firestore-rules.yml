name: Deploy Firestore rules

# Firebase doesn't read the rules from the repo: they have to be published to the project. This
# publishes firestore.rules to production whenever it changes on main, so the live rules always
# match the reviewed and tested ones. It can also be run by hand from the Actions tab.
on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
  workflow_dispatch:

# Never run two deploys at the same time
concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Firestore rules
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Service account that can only publish rules (role "Firebase Rules Admin"), its JSON key is
      # stored in the FIREBASE_SERVICE_ACCOUNT secret
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy rules
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --project oncompanion-c4144 --non-interactive
