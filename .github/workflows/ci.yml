# Co-authored-by: ChatGPT <noreply@openai.com>

name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# A new push to a PR cancels the run of the previous commit, which nobody needs anymore. Runs on
# main are never cancelled, so every merged commit is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hospital-proxy:
    name: Hospital proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install proxy dependencies
        run: npm --prefix functions ci
      - name: Check proxy formatting and types
        run: |
          npm --prefix functions run format:check
          npm --prefix functions run lint
      - name: Build proxy
        run: npm --prefix functions run build
      - name: Test proxy with Firestore emulator and coverage
        run: >-
          npx --yes firebase-tools@15.30.2 emulators:exec
          --config firebase.proxy-test.json --only firestore
          --project demo-oncompanion-proxy
          'node --test --experimental-test-coverage --test-coverage-include="functions/lib/*.js" --test-coverage-lines=90 --test-coverage-branches=90 --test-coverage-functions=90 functions/test/unit.test.mjs functions/test/firestore.test.mjs'


  # Formatting, lint, unit tests and the unsigned release build. They run beside the connected tests
  # in the connected test shards, so a formatting, lint or unit test error shows up in a few minutes
  # and they no longer add to the time of the whole run.
  checks:
    # The connected test shards read this job's result by its name: rename both together
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # Also keeps Robolectric's Android jars: Gradle downloads them like any dependency (#324)
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # The daemon runs on the JDK pinned in gradle/gradle-daemon-jvm.properties: show which one
      - name: Gradle and JDK versions
        run: |
          ./gradlew --version

      # Check formatting
      - name: KTFmt Check
        run: |
          ./gradlew ktfmtCheck

      - name: Lint
        run: |
          ./gradlew lintDebug --build-cache

      - name: Unit tests
        run: |
          ./gradlew testDebugUnitTest --build-cache

      # SonarCloud imports the lint issues, the unit test results and their coverage: the SonarCloud
      # job downloads them before its analysis. Paths are kept under app/build/. Kept 7 days, so
      # "Re-run failed jobs" on the SonarCloud job alone still finds them a few days later
      - name: Upload reports for SonarCloud
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-reports
          path: |
            app/build/reports/lint-results-debug.xml
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec
          if-no-files-found: warn
          retention-days: 7

      # Build the release variant (unsigned) on every run, so a PR that breaks R8 (a missing keep
      # rule) fails here. The signed APK is built and published by release.yml.
      - name: Assemble release
        run: |
          ./gradlew assembleRelease --build-cache

  # The app and its connected tests, built once for every shard
  build:
    # The shards wait for this job by its name (.github/scripts/run-connected-shard.sh): rename
    # both together
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      - name: Build the APKs
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest --build-cache

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

      # The classes inside those APKs, for the coverage report: JaCoCo matches classes by a CRC of
      # their bytes, so the report must read these and not another compile's
      - name: Upload the compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: debug-classes
          path: app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes/
          if-no-files-found: error
          retention-days: 3

  # The connected tests, split in 4 shards that run at the same time on their own runner, each with
  # its own Android emulator and Firebase emulators. No Gradle here: a shard boots its emulator
  # while the Build APKs job runs, then installs the APKs and runs a quarter of the test methods
  # (AndroidJUnitRunner's numShards and shardIndex), see .github/scripts/run-connected-shard.sh.
  # 4 rather than 3: the split is by test name, not by time, so smaller shards even out better
  connected:
    name: Connected tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # One failing shard doesn't cancel the others: their failures are worth seeing too
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux. Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache the Emulator, if the cache does not hit, create the emulator.
      # The emulator has a back camera so the real-camera test (ScanCameraTest) can run; the key changes
      # with the emulator's hardware, so an old snapshot without a camera is never reused.
      # API 34 matches targetSdk. compileSdk 37 is only the compile platform.
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-camera

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Firebase emulators (Auth + Firestore) used by the connected tests, see firebase.json.
      # The Android emulator reaches them on the host at 10.0.2.2.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Firebase emulators
        run: |
          npm install -g firebase-tools
          firebase emulators:start --only auth,firestore --project oncompanion-c4144 > firebase-emulators.log 2>&1 &
          timeout 180 bash -c 'until curl -s localhost:8080 > /dev/null && curl -s localhost:9099 > /dev/null; do sleep 2; done'

      # Checks often fails early (ktfmt after about a minute): then stop here, rather than after
      # several minutes of connected tests whose run can't reach SonarCloud anyway. Checks still
      # running, or its result unreadable: go on, the SonarCloud job waits for it
      - name: Stop if the Checks job already failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checks=$(gh run view ${{ github.run_id }} -R ${{ github.repository }} --json jobs \
            --jq '.jobs[] | select(.name == "Checks") | "\(.status) \(.conclusion)"') || exit 0
          case "$checks" in
            "completed success") ;;
            completed*)
              echo "The Checks job ended with \"${checks#completed }\", so the connected tests aren't run."
              echo "Fix it, or use \"Re-run failed jobs\" to run Checks and this job again."
              exit 1 ;;
          esac

      # This shard's quarter of the connected tests, on the APKs of the Build APKs job
      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: bash .github/scripts/run-connected-shard.sh ${{ matrix.shard }} 4

      # Only when something failed: the logs to find out why
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-logs-${{ matrix.shard }}
          path: |
            emulator-logcat.txt
            firebase-emulators.log
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Every run: the time of each test, to see what makes the tests slow
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Each shard's coverage in its own folder, so the SonarCloud job can put them side by side
      # where jacocoTestReport looks for them (connected/*/coverage.ec)
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: connected-coverage-${{ matrix.shard }}
          path: shard-coverage/
          if-no-files-found: error
          retention-days: 7

  # The coverage of all tests and the SonarCloud analysis. It starts with the other jobs and compiles
  # while the tests run (the SonarCloud upload needs the compiled app), then waits for the Checks
  # job (lint and unit tests) and every connected test shard to merge their reports
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # The SonarCloud upload needs the app compiled (its sonarResolver task, even with
      # sonar.gradle.skipCompile): done while the tests run. The coverage report doesn't use these
      # classes but the Build APKs job's, see "Use the classes the shards ran on"
      - name: Compile
        run: |
          ./gradlew compileDebugKotlin --build-cache

      # At most 20 min, every 30 s (GITHUB_TOKEN has 1,000 API calls per hour for the whole repo).
      # A failed job stops here: its reports are missing, and SonarCloud would show a wrong
      # coverage. "Re-run failed jobs" runs it and this job again (#300)
      - name: Wait for the tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 40); do
            # A read that fails (a GitHub API error) is said and tried again, not failing the job
            if jobs=$(gh run view ${{ github.run_id }} -R ${{ github.repository }} --json jobs \
              --jq '.jobs[] | select(.name == "Checks" or (.name | startswith("Connected tests"))) | "\(.status) \(.conclusion) \(.name)"'); then
              if [ "$(echo "$jobs" | wc -l)" -lt 5 ]; then
                echo "Expected the Checks job and 4 shards, found:" && echo "$jobs" && exit 1
              fi
              if echo "$jobs" | grep "^completed" | grep -v "^completed success"; then
                echo "SonarCloud isn't run without these reports."
                echo "Fix it, or use \"Re-run failed jobs\" to run them and this job again."
                exit 1
              fi
              echo "$jobs" | grep -qv "^completed" || exit 0
            else
              echo "Couldn't read the jobs of this run, trying again"
            fi
            sleep 30
          done
          echo "The tests didn't finish in time" && exit 1

      - name: Download reports of the Checks job
        uses: actions/download-artifact@v4
        with:
          name: checks-reports
          path: app/build

      - name: Download coverage of the connected tests
        uses: actions/download-artifact@v4
        with:
          pattern: connected-coverage-*
          merge-multiple: true
          path: app/build/outputs/code_coverage/debugAndroidTest/connected

      # In place of this job's own compile, which JaCoCo would silently not match if one class
      # differed (a compiler update, a non-deterministic generator). The upload's compile then
      # comes back from the build cache
      - name: Use the classes the shards ran on
        run: rm -rf app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes

      - name: Download the compiled classes
        uses: actions/download-artifact@v4
        with:
          name: debug-classes
          path: app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes

      - name: Generate Coverage Report
        run: |
          ./gradlew jacocoTestReport

      # Upload the various reports to sonar
      - name: Upload report to SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache
