name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# A new push to a PR cancels the run of the previous commit, which nobody needs anymore. Runs on
# main are never cancelled, so every merged commit is checked and publishes its APK.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hospital-proxy:
    name: Hospital proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install proxy dependencies
        run: npm --prefix functions ci
      - name: Check proxy formatting and types
        run: |
          npm --prefix functions run format:check
          npm --prefix functions run lint
      - name: Build proxy
        run: npm --prefix functions run build
      - name: Test proxy with Firestore emulator and coverage
        run: >-
          npx --yes firebase-tools@15.30.2 emulators:exec
          --config firebase.proxy-test.json --only firestore
          --project demo-oncompanion-proxy
          'node --test --experimental-test-coverage --test-coverage-include="functions/lib/*.js" --test-coverage-lines=80 --test-coverage-branches=80 --test-coverage-functions=80 functions/test/unit.test.mjs functions/test/firestore.test.mjs'


  # Formatting, lint and the release APK. They run beside the tests in the CI job, so a formatting
  # or lint error shows up in a few minutes and lint no longer adds to the time of the whole run.
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # Check formatting
      - name: KTFmt Check
        run: |
          ./gradlew ktfmtCheck

      - name: Lint
        run: |
          ./gradlew lintDebug --build-cache

      # SonarCloud imports the lint issues: the CI job downloads this report before its analysis
      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.xml
          if-no-files-found: error
          retention-days: 1

      # The signed release APK is built on main only: PRs never use it, and R8 takes about a minute.
      # Write the release key from the secrets, so the release APK is signed with the key registered
      # in Firebase (Google Sign-In fails otherwise). Secrets are missing on PRs from forks: skipped.
      - name: Decode release keystore
        if: github.event_name == 'push'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Assemble release
        if: github.event_name == 'push'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --build-cache

      - name: Upload APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: oncompanion-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 14

  # Unit and connected tests, their coverage and the SonarCloud analysis
  ci:
    name: CI
    # Execute the CI on the course's runners
    runs-on: ubuntu-latest

    steps:
      # First step : Checkout the repository on the runner
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis (if we use Sonar Later)

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux. Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # Caching is a very useful part of a CI, as a workflow is executed in a clean environment every time,
      # this means that one would need to re-download and re-process gradle files for every run. Which is very time consuming.
      #
      # To avoid that, we cache the the gradle folder to reuse it later.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Cache the Emulator, if the cache does not hit, create the emulator.
      # The emulator has a back camera so the real-camera test (ScanCameraTest) can run; the key changes
      # with the emulator's hardware, so an old snapshot without a camera is never reused.
      # API 34 matches targetSdk. compileSdk 37 is only the compile platform.
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-camera

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # Run Unit tests
      - name: Run tests
        run: |
          # To run the CI with debug information, add --info
          ./gradlew testDebugUnitTest --build-cache

      # Firebase emulators (Auth + Firestore) used by the connected tests, see firebase.json.
      # The Android emulator reaches them on the host at 10.0.2.2.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Firebase emulators
        run: |
          npm install -g firebase-tools
          firebase emulators:start --only auth,firestore --project oncompanion-c4144 > firebase-emulators.log 2>&1 &
          timeout 180 bash -c 'until curl -s localhost:8080 > /dev/null && curl -s localhost:9099 > /dev/null; do sleep 2; done'

      # Run connected tests on the emulator
      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          # No "isn't responding" dialogs: on the slow emulator they take the focus from the app
          # under test. The whole device's logcat is recorded, to see what happened when a test fails
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb logcat -v time > emulator-logcat.txt &
            ./gradlew connectedCheck --parallel --build-cache

      # Only when something failed: the logs to find out why
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-logs
          path: |
            emulator-logcat.txt
            firebase-emulators.log
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14

      # The lint report comes from the Checks job, which runs at the same time and is usually done
      # by now. Wait for it (at most 10 min), so SonarCloud still imports the lint issues
      - name: Wait for the Checks job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 60); do
            status=$(gh run view ${{ github.run_id }} -R ${{ github.repository }} --json jobs \
              --jq '.jobs[] | select(.name == "Checks") | .status')
            [ "$status" = "completed" ] && exit 0
            sleep 10
          done
          echo "The Checks job didn't finish in time" && exit 1

      # Missing when the Checks job failed early (formatting): Sonar then runs without lint issues
      - name: Download lint report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lint-report
          path: app/build/reports

      # This step generates the coverage report which will be uploaded to sonar
      - name: Generate Coverage Report
        run: |
          ./gradlew jacocoTestReport

      # Upload the various reports to sonar
      - name: Upload report to SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache
