# Co-authored-by: Claude Code <noreply@anthropic.com>

name: Weekly release

# Publish the signed APK as a GitHub Release once a week, or on demand from the Actions tab. It
# releases the latest commit on main whose CI passed, so a release only holds tested code.
on:
  schedule:
    - cron: "0 17 * * 4" # Thursday 17:00 UTC: 18:00 in Zurich in winter, 19:00 in summer
  workflow_dispatch: # Run workflow button

permissions:
  contents: write # To create tags and releases
  actions: read # To read CI's results

# Never run two releases at once, or both could try to create the same tag
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Find the latest commit on main whose CI passed, unless it's already released
  pick:
    name: Find the commit to release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      go: ${{ steps.pick.outputs.go }}
      sha: ${{ steps.pick.outputs.sha }}

    steps:
      - name: Find the commit to release
        id: pick
        run: |
          sha=$(gh run list --workflow ci.yml --branch main --event push --status success \
            --limit 1 --json headSha --jq '.[0].headSha')
          if [ -z "$sha" ]; then
            echo "::error::No CI run on main has passed: nothing to release"; exit 1
          fi

          # A tag already on this commit means it was released: nothing new since
          if [ -n "$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" \
                --jq ".[] | select(.object.sha == \"$sha\") | .ref")" ]; then
            echo "::notice::$sha is already released, skipping"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Build, sign and publish the APK of that commit
  release:
    name: Publish APK
    needs: pick
    if: needs.pick.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pick.outputs.sha }}
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Sign with the key registered in Firebase, or Google Sign-In fails in the released app
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is missing: the APK would be unsigned"; exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          RELEASE_NUMBER: ${{ github.run_number }} # Stamped into the APK's version
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      # Read the version Gradle stamped into the APK, so the tag always matches it
      - name: Read the version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          name=$("$aapt2" dump badging app/build/outputs/apk/release/app-release.apk \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")

          # A commit from before the stamp (e.g. picked while CI on a newer one still runs) builds
          # "1.0": refuse it rather than publish a release that looks like the final version
          case "$name" in
            *."$RUN_NUMBER") ;;
            *) echo "::error::APK version '$name' isn't stamped with release $RUN_NUMBER"; exit 1 ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          VERSION: ${{ steps.version.outputs.name }}
          SHA: ${{ needs.pick.outputs.sha }}
        run: |
          apk="oncompanion-$VERSION.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "v$VERSION" "$apk" \
            --target "$SHA" \
            --title "oncompanion $VERSION ($(TZ=Europe/Zurich date '+%-d %b %Y'))" \
            --generate-notes
