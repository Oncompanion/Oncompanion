name: Feature request
description: Suggest a new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: As a ..., I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
